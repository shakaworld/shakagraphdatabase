# VectorLawDB - Production-Grade Legal Vector Database in Rust
[workspace]
members = [
    "vectorlawdb-core",      # Core storage engine
    "vectorlawdb-spatial",   # Spatial indexes
    "vectorlawdb-citations", # Citation analysis
    "vectorlawdb-query",     # VQL query engine
    "vectorlawdb-server",    # REST API server
    "vectorlawdb-cli",       # Command-line tool
    "vectorlawdb-benches",   # Benchmarks
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["VectorLawDB Team"]
license = "Apache-2.0"
rust-version = "1.75"

[workspace.dependencies]
# Core utilities
tokio = { version = "1.35", features = ["full"] }
rayon = "1.8"              # Data parallelism
crossbeam = "0.8"          # Lock-free data structures
parking_lot = "0.12"       # Faster mutexes

# Serialization
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"            # Binary serialization
rmp-serde = "1.1"          # MessagePack

# Compression
lz4 = "1.24"
zstd = "0.13"

# Math & spatial
nalgebra = "0.32"          # Linear algebra
geo = "0.27"               # Geometric algorithms
rstar = "0.11"             # R-tree spatial index
petgraph = "0.6"           # Graph data structures and algorithms

# Hashing
ahash = "0.8"              # Fast hashing
xxhash-rust = "0.8"

# Async & networking
axum = "0.7"               # Web framework
tower = "0.4"              # Middleware
hyper = "1.0"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging & tracing
tracing = "0.1"
tracing-subscriber = "0.3"

# Memory-mapped files
memmap2 = "0.9"

# Date/time
chrono = "0.4"

# Command-line
clap = { version = "4.4", features = ["derive"] }
